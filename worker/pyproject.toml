# Python Worker project for whenwillhazeend.com.
#
# This lives in worker/ (not the repo root) on purpose: pywrangler treats the
# directory holding pyproject.toml as the Worker project root and refuses to run
# if a requirements.txt sits next to it, and the repo root keeps requirements.txt
# for the native uvicorn/pytest workflow.
#
# Runtime deps only. Versions are resolved against the Pyodide package index
# for the Python version selected by wrangler.jsonc's compatibility_date
# (>= 2026-09-08 -> Python 3.14) and pinned in pylock.toml by `pywrangler sync`.
# scipy is NOT here: it is only used by app/model/calibrate.py at build time.
# jinja2 is NOT here: pages are served pre-rendered by Workers Static Assets.
[project]
name = "whenwillhazeend-worker"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "numpy",
    # Open-Meteo client used by app/model/meteo.py. Its *sync* httpx.Client works
    # inside a Python Worker (Pyodide runs it on the Workers fetch API via JSPI),
    # but the request must send "Accept-Encoding: identity" -- see PLATFORM.md.
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
